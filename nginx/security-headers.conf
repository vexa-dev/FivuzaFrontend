# Incluido en cada location que define su propio add_header: en nginx, un
# add_header dentro de location anula TODOS los heredados del server.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# serial: balanza electronica del POS (Web Serial API).
add_header Permissions-Policy "serial=(self), camera=(self), geolocation=()" always;
