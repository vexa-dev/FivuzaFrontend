name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm ci
    - name: Run oxlint
      run: npm run lint
    - name: Check CSS tokens
      run: npm run lint:tokens

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm run test:ci

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Install dependencies
      run: npm ci
    - name: Build frontend
      run: npm run build
    - name: Build Docker image
      run: docker build . --file Dockerfile --tag fivuzafrontend:test

  e2e:
    # Flujo real de caja contra el backend (e2e/README.md). El backend es un
    # repositorio privado: sin el secreto BACKEND_REPO_TOKEN el job se omite.
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
    - name: Check backend access
      id: access
      env:
        TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
      run: |
        if [ -z "$TOKEN" ]; then
          echo "::notice::E2E omitido: falta el secreto BACKEND_REPO_TOKEN."
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        fi
    - uses: actions/checkout@v7
      if: steps.access.outputs.enabled == 'true'
      with:
        path: FivuzaFrontend
    # Una feature que toca los dos repos usa el mismo nombre de rama en
    # ambos: si el backend tiene la rama de este PR, el E2E corre contra
    # ella (contra main fallaria por lo que aun no se mergeo alla). Si no
    # la tiene, main. El nombre va por env, no interpolado en el script.
    - name: Resolve backend branch
      id: backend
      if: steps.access.outputs.enabled == 'true'
      env:
        TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if git ls-remote --exit-code --heads \
          "https://x-access-token:${TOKEN}@github.com/vexa-dev/FivuzaBackend.git" \
          "refs/heads/${BRANCH}" > /dev/null; then
          ref="$BRANCH"
        else
          ref="main"
        fi
        echo "::notice::E2E contra la rama '${ref}' del backend."
        echo "ref=${ref}" >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@v7
      if: steps.access.outputs.enabled == 'true'
      with:
        repository: vexa-dev/FivuzaBackend
        ref: ${{ steps.backend.outputs.ref }}
        token: ${{ secrets.BACKEND_REPO_TOKEN }}
        path: FivuzaBackend
    - name: Start backend
      if: steps.access.outputs.enabled == 'true'
      working-directory: FivuzaBackend
      run: |
        cp .env.example .env
        # La suite hace mas de 5 logins por minuto desde la misma IP: con el
        # throttle de login encendido (el default fuera de las pruebas de
        # Django) el sexto recibe 429 y el E2E falla por el entorno, no por
        # el codigo.
        echo "THROTTLE_ENABLED=False" >> .env
        docker compose up -d --build --wait db redis web
        docker compose exec -T web python manage.py migrate_schemas --shared
    - uses: actions/setup-node@v7
      if: steps.access.outputs.enabled == 'true'
      with:
        node-version: '22'
    - name: Install dependencies and browser
      if: steps.access.outputs.enabled == 'true'
      working-directory: FivuzaFrontend
      run: |
        npm ci
        npx playwright install --with-deps chromium
    - name: Run E2E
      if: steps.access.outputs.enabled == 'true'
      working-directory: FivuzaFrontend
      run: |
        npm run dev -- --port 5173 > vite.log 2>&1 &
        npx --yes wait-on --timeout 60000 http://localhost:5173
        npm run e2e
    - name: Upload Playwright report
      if: failure() && steps.access.outputs.enabled == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          FivuzaFrontend/playwright-report
          FivuzaFrontend/test-results
          FivuzaFrontend/vite.log
